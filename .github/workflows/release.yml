name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'
          - goos: windows
            goarch: arm64
            ext: '.exe'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Download dependencies
        run: go mod download

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
        run: |
          OUTPUT_NAME="mdadf${EXT}"
          go build -o "${OUTPUT_NAME}" ./cmd/mdadf
          echo "ASSET_PATH=${OUTPUT_NAME}" >> $GITHUB_ENV
          echo "ASSET_NAME=mdadf-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET_PATH }}

  create-release:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create checksums
        run: |
          find artifacts -type f -name 'mdadf*' -not -name '*.sha256' | while read -r file; do
            if command -v sha256sum > /dev/null; then
              sha256sum "$file" > "${file}.sha256"
            else
              shasum -a 256 "$file" > "${file}.sha256"
            fi
          done

      - name: Create Release
        id: create_release
        run: |
          response=$(curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d '{
              "tag_name": "${{ github.ref_name }}",
              "name": "Release ${{ github.ref_name }}",
              "generate_release_notes": true,
              "draft": false,
              "prerelease": ${{ contains(github.ref, '-') }}
            }')
          release_id=$(echo "$response" | jq -r '.id')
          echo "release_id=$release_id" >> $GITHUB_OUTPUT
          echo "Created release with ID: $release_id"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets
        run: |
          release_id=${{ steps.create_release.outputs.release_id }}
          find artifacts -type f \( -name 'mdadf*' -o -name '*.sha256' \) | while read -r file; do
            # Get the directory name (platform) and filename
            dir_name=$(dirname "$file" | xargs basename)
            file_name=$(basename "$file")
            # Use directory name as the asset name (it already contains platform info)
            if [[ "$dir_name" != "artifacts" ]] && [[ "$dir_name" == "mdadf-"* ]]; then
              asset_name="$dir_name"
              # If it's a checksum file, append .sha256
              if [[ "$file_name" == *.sha256 ]]; then
                asset_name="${asset_name}.sha256"
              fi
            else
              asset_name="$file_name"
            fi
            echo "Uploading $asset_name from $file"
            curl -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$file" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/$release_id/assets?name=$asset_name" || echo "Failed to upload $asset_name"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
